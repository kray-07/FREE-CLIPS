<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE-CLIPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        @keyframes blinkBox {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); border-color: #1f2937; }
            50% { box-shadow: 0 0 0 5px rgba(59,130,246,.75); border-color: #3b82f6; }
        }
        .blink { animation: blinkBox .7s ease-in-out 4; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Açılış Duyurusu (6 sn kapanmaz) -->
    <div id="welcomeOverlay" class="hidden fixed inset-0 z-[100] bg-[#0b0f19]/95 backdrop-blur flex flex-col items-center justify-center px-6 text-center transition-opacity duration-500">
        <h2 class="text-2xl font-bold text-white mb-4">FREE-CLIPS</h2>
        <p id="welcomeText" class="text-gray-300 text-base max-w-md leading-relaxed whitespace-pre-line"></p>
        <div class="absolute bottom-10 left-0 right-0 px-8">
            <div class="max-w-xs mx-auto">
                <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden mb-3">
                    <div id="welcomeBar" class="h-full bg-white rounded-full" style="width:100%; transition: width 1s linear;"></div>
                </div>
                <p class="text-sm text-gray-400">Site <span id="welcomeCount" class="text-white font-semibold">6</span> saniye içinde açılıyor...</p>
            </div>
        </div>
    </div>


    <!-- Üst Menü -->
    <header class="border-b border-gray-800 bg-[#0b0f19]/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-wider text-white">FREE-CLIPS</h1>
            <button id="adminBtn" onclick="handleAdminClick()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition">
                Yönetici Girişi
            </button>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- Yalnızca Yöneticiye Görünen Panel -->
        <div id="adminPanel" class="hidden mb-10 bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-white">Yeni Klip Ekle</h2>
            <form id="uploadForm" onsubmit="uploadClip(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Klip Başlığı</label>
                    <input type="text" id="titleInput" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gray-600 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Video URL (Streamable vb.)</label>
                    <input type="url" id="videoUrlInput" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gray-600 text-sm">
                </div>

                <button type="submit" class="w-full bg-white hover:bg-gray-200 text-black font-medium py-2.5 rounded-lg text-sm transition">
                    Klipi Yükle
                </button>
            </form>

            <div class="border-t border-gray-800 mt-6 pt-5">
                <h2 class="text-lg font-semibold mb-3 text-white">Açılış Yazısı</h2>
                <textarea id="welcomeInput" rows="4" maxlength="600" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gray-600 text-sm"></textarea>
                <button type="button" onclick="saveWelcomeText()" class="mt-3 w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg text-sm transition">
                    Yazıyı Kaydet
                </button>
            </div>
        </div>

        <!-- Herkese Açık Video İndirme -->
        <section id="downloadSection" class="mb-8 bg-gray-900 border border-gray-800 p-5 rounded-2xl shadow-xl">
            <h2 class="text-base font-semibold text-white mb-1">Video İndir</h2>
            <p class="text-xs text-gray-500 mb-3">Sadece Streamable linkleri desteklenir.</p>
            <div class="flex gap-2">
                <input type="url" id="downloadUrlInput" placeholder="https://streamable.com/..."
                    class="flex-1 min-w-0 bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gray-600 text-sm">
                <button type="button" id="downloadBtn" onclick="downloadVideo()"
                    class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 rounded-lg transition">
                    İndir
                </button>
            </div>
            <p id="downloadStatus" class="text-xs text-gray-500 mt-2"></p>
        </section>

        <!-- Klip Listesi -->
        <h2 class="text-2xl font-bold text-white mb-4">Clipler</h2>
        <div id="clipsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </main>

    <footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        FREE-CLIPS &copy; 2026
    </footer>

    <script>
        // Supabase Bağlantı Bilgileri
        const SUPABASE_URL = 'https://yintuewhjzcbygcjdqyy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpbnR1ZXdoanpjYnlnY2pkcXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODkyNDksImV4cCI6MjEwODQ2NTI0OX0.kZOFUF_V7tq__GX-lDBa1ZEVKhhro5QqtUOSecWjbzQ';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isAdmin = false;


        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function setAdminUI(on) {
            isAdmin = on;
            document.getElementById('adminPanel').classList.toggle('hidden', !on);
            document.getElementById('adminBtn').textContent = on ? 'Çıkış Yap' : 'Yönetici Girişi';
            if (on) document.getElementById('welcomeInput').value = currentWelcome;
        }

        // Sayfa açıldığında: açık oturum varsa yönetici modunu aç, klipleri yükle
        window.addEventListener('DOMContentLoaded', async () => {
            const { data } = await supabaseClient.auth.getSession();
            if (data && data.session) setAdminUI(true);
            fetchClips();
        });

        // Yönetici Girişi / Çıkışı (şifre kodda tutulmaz, Supabase doğrular)
        async function handleAdminClick() {
            if (!isAdmin) {
                const email = prompt("E-posta:");
                if (!email) return;
                const password = prompt("Şifre:");
                if (!password) return;

                const { error } = await supabaseClient.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });
                if (error) { alert("Giriş başarısız: " + error.message); return; }
                setAdminUI(true);
            } else {
                await supabaseClient.auth.signOut();
                setAdminUI(false);
            }
            fetchClips();
        }

        // Klipleri Veritabanından Çekme
        async function fetchClips() {
            const grid = document.getElementById('clipsGrid');
            grid.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-10">Klipler yükleniyor...</p>';

            const { data, error } = await supabaseClient
                .from('clips')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Klipler çekilemedi:", error);
                grid.innerHTML = '<p class="text-red-400 text-sm col-span-full text-center py-10">Klipler yüklenirken bir hata oluştu.<br><span class="text-xs text-red-300">' + esc(error.message || 'Bilinmeyen hata') + (error.code ? ' (' + esc(error.code) + ')' : '') + '</span></p>';
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-10">Henüz hiç klip eklenmemiş.</p>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(clip => {
                const card = document.createElement('div');
                card.className = 'bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between space-y-4';

                card.innerHTML = `
                    <div>
                        <h3 class="text-base font-semibold text-white mb-2">${esc(clip.title)}</h3>
                        <a href="${esc(clip.video_url)}" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-400 hover:text-blue-300 break-all underline flex items-center gap-1.5">
                            🔗 Videoyu Görüntüle / İndir
                        </a>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-gray-800/60">
                        <button data-copy="${esc(clip.video_url)}" class="text-xs bg-blue-950/60 hover:bg-blue-900 text-blue-300 border border-blue-900/60 px-3 py-1 rounded-lg transition">📋 Kopyala</button>
                        ${isAdmin ? `<button onclick="deleteClip('${esc(clip.id)}')" class="text-xs bg-red-950/50 hover:bg-red-900 text-red-300 border border-red-900/50 px-3 py-1 rounded-lg transition">Sil</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Yeni Klip Yükleme
        async function uploadClip(e) {
            e.preventDefault();

            const title = document.getElementById('titleInput').value.trim();
            const video_url = document.getElementById('videoUrlInput').value.trim();
            const id = 'clip_' + Date.now();

            const { error } = await supabaseClient
                .from('clips')
                .insert([{ id, title, video_url }]);

            if (error) {
                alert("Yükleme hatası: " + error.message);
                return;
            }

            alert("Klip başarıyla yüklendi!");
            document.getElementById('uploadForm').reset();
            fetchClips();
        }

        // Klip Silme (Yönetici Özel)
        async function deleteClip(id) {
            if (!confirm("Bu klipi silmek istediğine emin misin?")) return;

            const { error } = await supabaseClient
                .from('clips')
                .delete()
                .eq('id', id);

            if (error) {
                alert("Silme hatası: " + error.message);
                return;
            }

            alert("Klip silindi.");
            fetchClips();
        }

        // ---- Açılış duyurusu (yönetici panelinden düzenlenir) ----
        const DEFAULT_WELCOME = "Hoş geldin! Buradaki clipleri izleyebilir ve Streamable linkini yapıştırarak istediğin videoyu indirebilirsin.";
        const WELCOME_SECONDS = 6;
        let currentWelcome = DEFAULT_WELCOME;

        async function loadWelcomeText() {
            try {
                const q = supabaseClient.from('settings').select('value').eq('key', 'welcome_text').maybeSingle();
                const res = await Promise.race([q, new Promise(r => setTimeout(() => r(null), 2000))]);
                if (res && res.data && res.data.value) currentWelcome = res.data.value;
            } catch (e) {}
        }

        async function saveWelcomeText() {
            const v = document.getElementById('welcomeInput').value.trim();
            if (!v) { alert("Yazı boş olamaz."); return; }
            const { error } = await supabaseClient.from('settings').upsert({ key: 'welcome_text', value: v });
            if (error) { alert("Kaydetme hatası: " + error.message); return; }
            currentWelcome = v;
            alert("Açılış yazısı kaydedildi!");
        }

        async function showWelcome() {
            try { if (sessionStorage.getItem('welcomeSeen')) return; } catch (e) {}
            await loadWelcomeText();

            const ov = document.getElementById('welcomeOverlay');
            document.getElementById('welcomeText').textContent = currentWelcome;
            ov.classList.remove('hidden');
            ov.classList.add('flex');
            document.body.style.overflow = 'hidden';

            let left = WELCOME_SECONDS;
            const count = document.getElementById('welcomeCount');
            const bar = document.getElementById('welcomeBar');
            count.textContent = left;

            const t = setInterval(() => {
                left--;
                count.textContent = left;
                bar.style.width = (left / WELCOME_SECONDS * 100) + '%';
                if (left <= 0) {
                    clearInterval(t);
                    ov.style.opacity = '0';
                    setTimeout(() => {
                        ov.remove();
                        document.body.style.overflow = '';
                    }, 500);
                    try { sessionStorage.setItem('welcomeSeen', '1'); } catch (e) {}
                }
            }, 1000);
        }
        showWelcome();

        // ---- Kopyala: linki kopyalar, indirme kutusuna koyar, yukarı kaydırıp yakıp söndürür ----
        async function copyClip(url) {
            try {
                await navigator.clipboard.writeText(url);
            } catch (e) {
                const t = document.createElement('textarea');
                t.value = url;
                document.body.appendChild(t);
                t.select();
                try { document.execCommand('copy'); } catch (_) {}
                t.remove();
            }
            document.getElementById('downloadUrlInput').value = url;
            document.getElementById('downloadStatus').textContent = "Link kopyalandı, İndir'e bas 👇";

            const sec = document.getElementById('downloadSection');
            sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
            sec.classList.remove('blink');
            void sec.offsetWidth;
            sec.classList.add('blink');
            setTimeout(() => sec.classList.remove('blink'), 3200);
        }

        document.getElementById('clipsGrid').addEventListener('click', e => {
            const b = e.target.closest('[data-copy]');
            if (b) copyClip(b.dataset.copy);
        });

        // ---- Streamable video indirme (herkes kullanabilir) ----
        async function resolveStreamable(url) {
            const m = url.match(/^https?:\/\/(?:www\.)?streamable\.com\/(?:[a-z]\/)?([a-z0-9]+)/i);
            if (!m) throw new Error('Sadece streamable.com linkleri destekleniyor.');

            const r = await fetch('https://api.streamable.com/videos/' + m[1]);
            if (!r.ok) throw new Error('Video bulunamadı. Link silinmiş olabilir.');
            const d = await r.json();
            const f = d.files?.mp4 || d.files?.['mp4-mobile'];
            if (!f?.url) throw new Error('Bu videonun indirme linki alınamadı.');
            return f.url.startsWith('//') ? 'https:' + f.url : f.url;
        }

        async function downloadVideo() {
            const url = document.getElementById('downloadUrlInput').value.trim();
            const status = document.getElementById('downloadStatus');
            const btn = document.getElementById('downloadBtn');
            if (!url) { status.textContent = 'Önce bir Streamable linki yapıştır.'; return; }

            btn.disabled = true;
            status.textContent = 'Video aranıyor...';

            try {
                const videoUrl = await resolveStreamable(url);
                status.textContent = 'İndiriliyor...';
                try {
                    const blob = await (await fetch(videoUrl)).blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'clip_' + Date.now() + '.mp4';
                    a.click();
                    URL.revokeObjectURL(a.href);
                    status.textContent = 'İndirme başladı ✅';
                } catch {
                    window.open(videoUrl, '_blank');
                    status.textContent = 'Video yeni sekmede açıldı, oradan kaydedebilirsin.';
                }
            } catch (err) {
                status.textContent = '❌ ' + err.message;
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
