<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE-CLIPS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Üst Menü -->
    <header class="border-b border-gray-800 bg-[#0b0f19]/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-wider text-white">FREE-CLIPS</h1>
            <button id="adminBtn" onclick="handleAdminClick()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition">
                Yönetici Girişi
            </button>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Yalnızca Yöneticiye Görünen Yükleme Paneli -->
        <div id="adminPanel" class="hidden mb-10 bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-white">Yeni Klip Ekle</h2>
            <form id="uploadForm" onsubmit="uploadClip(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Klip Başlığı</label>
                    <input type="text" id="titleInput" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gray-600 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Video URL (Streamable vb.)</label>
                    <input type="url" id="videoUrlInput" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gray-600 text-sm">
                </div>
                <button type="submit" class="w-full bg-white hover:bg-gray-200 text-black font-medium py-2.5 rounded-lg text-sm transition">
                    Klipi Yükle
                </button>
            </form>
        </div>

        <!-- Klip Listesi Grid Alanı -->
        <div id="clipsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Klipler buraya dinamik olarak gelecek -->
        </div>
    </main>

    <!-- Alt Bilgi -->
    <footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        FREE-CLIPS &copy; 2026
    </footer>

    <!-- JavaScript Kodları -->
    <script>
        // Supabase Bağlantı Bilgileri
        const SUPABASE_URL = 'https://yintuewhjzcbygcjdqyy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpbnR1ZXdoanpjYnlnY2pkcXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODkyNDksImV4cCI6MjEwODQ2NTI0OX0.kZOFUF_V7tq__GX-lDBa1ZEVKhhro5QqtUOSecWjbzQ';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isAdmin = false;
        const ADMIN_PASS = "147258369melo";

        // Sayfa açıldığında klipleri yükle
        window.addEventListener('DOMContentLoaded', () => {
            fetchClips();
        });

        // Yönetici Girişi / Çıkışı Butonu
        function handleAdminClick() {
            if (!isAdmin) {
                const pass = prompt("Yönetici şifresini girin:");
                if (pass === ADMIN_PASS) {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.remove('hidden');
                    document.getElementById('adminBtn').textContent = 'Çıkış Yap';
                    alert("Yönetici girişi başarılı!");
                } else if (pass !== null) {
                    alert("Yanlış şifre!");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminPanel').classList.add('hidden');
                document.getElementById('adminBtn').textContent = 'Yönetici Girişi';
                alert("Yönetici oturumu kapatıldı.");
            }
            fetchClips();
        }

        // Klipleri Veritabanından Çekme
        async function fetchClips() {
            const grid = document.getElementById('clipsGrid');
            grid.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-10">Klipler yükleniyor...</p>';

            const { data, error } = await supabaseClient
                .from('clips')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Klipler çekilemedi:", error);
                grid.innerHTML = '<p class="text-red-400 text-sm col-span-full text-center py-10">Klipler yüklenirken bir hata oluştu.</p>';
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-10">Henüz hiç klip eklenmemiş.</p>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(clip => {
                const card = document.createElement('div');
                card.className = 'bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between space-y-4';
                
                card.innerHTML = `
                    <div>
                        <h3 class="text-base font-semibold text-white mb-2">${clip.title}</h3>
                        <a href="${clip.video_url}" target="_blank" class="text-xs text-blue-400 hover:text-blue-300 break-all underline flex items-center gap-1.5">
                            🔗 Videoyu Görüntüle / İndir
                        </a>
                    </div>
                    <div class="flex items-center justify-end pt-2 border-t border-gray-800/60">
                        ${isAdmin ? `<button onclick="deleteClip('${clip.id}')" class="text-xs bg-red-950/50 hover:bg-red-900 text-red-300 border border-red-900/50 px-3 py-1 rounded-lg transition">Sil</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Yeni Klip Yükleme
        async function uploadClip(e) {
            e.preventDefault();

            const title = document.getElementById('titleInput').value.trim();
            const video_url = document.getElementById('videoUrlInput').value.trim();
            const id = 'clip_' + Date.now();

            const { error } = await supabaseClient
                .from('clips')
                .insert([{ id, title, video_url }]);

            if (error) {
                alert("Yükleme hatası: " + error.message);
                return;
            }

            alert("Klip başarıyla yüklendi!");
            document.getElementById('uploadForm').reset();
            fetchClips();
        }

        // Klip Silme (Yönetici Özel)
        async function deleteClip(id) {
            if (!confirm("Bu klipi silmek istediğine emin misin?")) return;

            const { error } = await supabaseClient
                .from('clips')
                .delete()
                .eq('id', id);

            if (error) {
                alert("Silme hatası: " + error.message);
                return;
            }

            alert("Klip silindi.");
            fetchClips();
        }
    </script>
</body>
</html>
