<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeloClips</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Üst Bilgi -->
    <header class="border-b border-slate-800 p-4 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-cyan-400">MELOCLIPS</h1>
            <span class="text-xs bg-cyan-500/10 text-cyan-400 px-3 py-1 rounded-full border border-cyan-500/20">GitHub Sürümü</span>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-4xl mx-auto p-4 flex-1 w-full space-y-6">
        
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center space-y-2">
            <h2 class="text-sm font-semibold text-slate-300">Klipler</h2>
            <p class="text-xs text-slate-500">Videoların doğrudan GitHub deposundan yükleniyor ve herkese açık.</p>
        </div>

        <!-- Videoların Listelendiği Alan -->
        <div id="videoContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Videolar aşağıda otomatik listelenir -->
        </div>

    </main>

    <script>
        // Kliplerini buraya ekleyeceksin. 
        // GitHub'a yüklediğin video dosyalarının adını ve başlığını buraya yazman yeterli!
        const clips = [
            {
                title: "Beşiktaş Editi",
                file: "videos/besiktas.mp4" // GitHub'daki video dosyasının yolu
            },
            {
                title: "Minecraft PvP Klip",
                file: "videos/minecraft.mp4"
            }
        ];

        function loadVideos() {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            if (clips.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm col-span-2 text-center">Henüz klip eklenmemiş.</p>';
                return;
            }

            clips.forEach(clip => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-md space-y-2 p-3";
                card.innerHTML = `
                    <h3 class="font-medium text-sm text-slate-200 truncate">${clip.title}</h3>
                    <video controls src="${clip.file}" class="w-full h-48 object-cover rounded-xl bg-black"></video>
                `;
                container.appendChild(card);
            });
        }

        loadVideos();
    </script>
</body>
</html>
